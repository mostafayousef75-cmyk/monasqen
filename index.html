<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادات بماجستى وجداول الأطباء</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #fafbfc;
            --border-color: #e1e8ed;
            --input-bg: #ffffff;
            --input-text: #333333;
            --table-even: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --box-bg: #2d2d2d;
            --border-color: #444444;
            --input-bg: #333333;
            --input-text: #ffffff;
            --table-even: #252525;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; direction: rtl; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1450px; margin: auto; background: var(--container-bg); color: var(--text-color); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: background-color 0.3s, color 0.3s; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h2, h3 { color: var(--text-color); margin: 0; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sync-badge { background: #28a745; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .theme-toggle-btn { background: none; border: 2px solid var(--border-color); color: var(--text-color); font-size: 20px; padding: 6px 14px; border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .theme-toggle-btn:hover { background: rgba(128,128,128,0.2); }

        .nav-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .tab-btn { background: var(--box-bg); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--text-color); transition: 0.2s; }
        .tab-btn.active, .tab-btn:hover { background: #007bff; color: white; border-color: #007bff; }
        .tab-btn.priority-tab { background: #dc3545; color: white; border-color: #dc3545; }
        .tab-btn.priority-tab:hover { background: #c82333; }

        .section-box { background: var(--box-bg); color: var(--text-color); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px; transition: 0.3s; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--text-color); }
        input, select, textarea { padding: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--input-text); border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; height: 40px; }
        
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; width: 100%; padding: 12px; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; padding: 6px 10px; font-size: 12px; margin-left: 5px; }
        .btn-warning:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: white; padding: 6px 10px; font-size: 12px; }
        .btn-danger:hover { background: #c82333; }
        .btn-export { background: #17a2b8; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-export:hover { background: #138496; }
        .btn-print { background: #6610f2; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-print:hover { background: #520dc2; }
        .btn-import { background: #6c757d; color: white; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-block; text-align: center; border-radius: 6px; }
        .btn-import:hover { background: #5a6268; }

        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--box-bg); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        .kpi-card h4 { margin: 0; font-size: 14px; color: var(--text-color); opacity: 0.8; }
        .kpi-card span { font-size: 22px; font-weight: bold; color: #007bff; display: block; margin-top: 5px; }

        .coordinator-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .coord-card { background: var(--container-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 8px; font-size: 13px; }
        .coord-card h5 { margin: 0 0 8px 0; color: #007bff; font-size: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }

        .filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; background: var(--container-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .search-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; }
        .search-box input { flex: 1; min-width: 200px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; color: var(--text-color); }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; font-size: 13px; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: var(--table-even); }
        
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; }
        .bg-success { background: #28a745; }
        .bg-warning { background: #ffc107; color: #333; }
        .bg-danger { background: #dc3545; }
        .bg-info { background: #17a2b8; }
        .bg-purple { background: #6f42c1; }
        
        .view-section { display: none; }
        .view-section.active-view { display: block; }

        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { box-shadow: none !important; padding: 0 !important; width: 100% !important; max-width: 100% !important; background: white !important; color: black !important; }
            .header-actions, .nav-tabs, .section-box:has(.form-grid), .search-box, .btn, button, input, select, textarea, .kpi-container { display: none !important; }
            .view-section { display: none !important; }
            #mainView { display: block !important; }
            table { font-size: 11px !important; width: 100% !important; border: 1px solid #000 !important; }
            th, td { border: 1px solid #000 !important; color: black !important; padding: 5px !important; }
            th { background-color: #ddd !important; color: black !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .badge { border: 1px solid #000; color: black !important; background: none !important; }
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-flex">
        <h2>🏥 نظام إدارة العيادات بماجستى وجداول الأطباء والمنسقين</h2>
        <div class="header-actions">
            <span class="sync-badge" id="syncStatus">🟢 متصل بالسحابة (مباشر)</span>
            <button class="btn btn-export" onclick="exportData()" title="تحميل نسخة احتياطية">📥 تصدير السجلات</button>
            <button class="btn btn-print" onclick="printTodayReport()" title="طباعة تقرير الحالات">🖨️ طباعة تقرير اليوم</button>
            <label class="btn-import" title="استعادة سجلات من ملف احتياطي">
                📤 استيراد السجلات <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">
            </label>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير الوضع المظلم/الفاتح">🌙</button>
        </div>
    </div>

    <!-- شريط التنقل بين الصفحات -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchView('mainView', event)">📋 لوحة المنسقين الرئيسية</button>
        <button class="tab-btn priority-tab" onclick="switchView('priorityView', event)">🚨 الحالات المتكررة والأولوية (<span id="priorityCountBadge">0</span>)</button>
        <button class="tab-btn" onclick="switchView('docMahmoud', event)">👨‍⚕️ د. محمود</button>
        <button class="tab-btn" onclick="switchView('docSamy', event)">👨‍⚕️ د. سامى</button>
        <button class="tab-btn" onclick="switchView('docAbdullah', event)">👨‍⚕️ د. عبد الله</button>
        <button class="tab-btn" onclick="switchView('docMarwan', event)">👨‍⚕️ د. مروان</button>
        <button class="tab-btn" onclick="switchView('docEngy', event)">👩‍⚕️ د. إنجى</button>
        <button class="tab-btn" onclick="switchView('docDermatology', event)">🩺 الجلدية</button>
        <button class="tab-btn" onclick="switchView('docOther', event)">📌 أخرى</button>
    </div>

    <!-- 1. اللوحة الرئيسية للمنسقين -->
    <div id="mainView" class="view-section active-view">
        
        <div class="kpi-container">
            <div class="kpi-card">
                <h4>إجمالي الحالات</h4>
                <span id="totalCases">0</span>
            </div>
            <div class="kpi-card">
                <h4>تم التواصل (إدارة)</h4>
                <span id="resolvedCases" style="color: #28a745;">0</span>
            </div>
            <div class="kpi-card">
                <h4>قيد الانتظار</h4>
                <span id="pendingCases" style="color: #e67e22;">0</span>
            </div>
        </div>

        <!-- تقارير سريعة وأحصائيات للمنسقين (KPIs متقدمة) -->
        <div class="section-box">
            <h3>📊 تقارير وإحصائيات أداء المنسقين (نشاط اليوم)</h3>
            <div id="coordinatorStatsContainer" class="coordinator-stats-grid" style="margin-top: 15px;">
                <!-- يتم تعبئتها ديناميكياً -->
            </div>
        </div>

        <!-- نموذج تسجيل أو تعديل حجز -->
        <div class="section-box">
            <h3 id="formTitle">📝 تسجيل موعد / حالة جديدة</h3>
            <input type="hidden" id="editKey" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label>اسم المريض:</label>
                    <input type="text" id="patientName" placeholder="أدخل اسم المريض">
                </div>
                <div class="form-group">
                    <label>رقم الجوال:</label>
                    <input type="text" id="patientPhone" placeholder="05xxxxxxxx">
                </div>
                <div class="form-group">
                    <label>رقم الهوية:</label>
                    <input type="text" id="patientId" placeholder="رقم الهوية الوطنية">
                </div>
                <div class="form-group">
                    <label>رقم الملف:</label>
                    <input type="text" id="fileNumber" placeholder="رقم ملف المريض بالعيادة">
                </div>
                <div class="form-group">
                    <label>طريقة التواصل:</label>
                    <select id="contactMethod">
                        <option value="اتصال">اتصال 📞</option>
                        <option value="شات">شات 💬</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الفرع:</label>
                    <select id="clinicBranch">
                        <option value="معشي">معشي</option>
                        <option value="الوسام">الوسام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الطبيب المعالج:</label>
                    <select id="doctorName" onchange="checkDoctorOther()">
                        <option value="د. محمود">د. محمود</option>
                        <option value="د. سامى">د. سامى</option>
                        <option value="د. عبد الله">د. عبد الله</option>
                        <option value="د. مروان">د. مروان</option>
                        <option value="د. إنجى">د. إنجى</option>
                        <option value="الجلدية">الجلدية</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>
                <div class="form-group" id="doctorOtherGroup" style="display: none;">
                    <label>اكتب الطبيب / التخصص الآخر:</label>
                    <input type="text" id="doctorOtherInput" placeholder="اكتب اسم الطبيب أو التخصص...">
                </div>
                <div class="form-group">
                    <label>نوع المتابعة:</label>
                    <select id="caseStatus">
                        <option value
