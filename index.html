<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادات بماجستى وجداول الأطباء</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --box-bg: #fafbfc;
            --border-color: #e1e8ed;
            --input-bg: #ffffff;
            --input-text: #333333;
            --table-even: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --box-bg: #2d2d2d;
            --border-color: #444444;
            --input-bg: #333333;
            --input-text: #ffffff;
            --table-even: #252525;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; direction: rtl; transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 1450px; margin: auto; background: var(--container-bg); color: var(--text-color); padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: background-color 0.3s, color 0.3s; }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h2, h3 { color: var(--text-color); margin: 0; }
        
        .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .sync-badge { background: #28a745; color: white; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        
        .theme-toggle-btn { background: none; border: 2px solid var(--border-color); color: var(--text-color); font-size: 20px; padding: 6px 14px; border-radius: 50px; cursor: pointer; transition: 0.2s; }
        .theme-toggle-btn:hover { background: rgba(128,128,128,0.2); }

        .nav-tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .tab-btn { background: var(--box-bg); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; color: var(--text-color); transition: 0.2s; }
        .tab-btn.active, .tab-btn:hover { background: #007bff; color: white; border-color: #007bff; }
        .tab-btn.priority-tab { background: #dc3545; color: white; border-color: #dc3545; }
        .tab-btn.priority-tab:hover { background: #c82333; }

        .section-box { background: var(--box-bg); color: var(--text-color); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 25px; transition: 0.3s; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: var(--text-color); }
        input, select, textarea { padding: 10px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--input-text); border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; height: 40px; }
        
        .btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #0056b3; }
        .btn-success { background: #28a745; width: 100%; padding: 12px; }
        .btn-success:hover { background: #218838; }
        .btn-warning { background: #ffc107; color: #333; padding: 6px 10px; font-size: 12px; margin-left: 5px; }
        .btn-warning:hover { background: #e0a800; }
        .btn-danger { background: #dc3545; color: white; padding: 6px 10px; font-size: 12px; }
        .btn-danger:hover { background: #c82333; }
        .btn-export { background: #17a2b8; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-export:hover { background: #138496; }
        .btn-import { background: #6c757d; color: white; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-block; text-align: center; border-radius: 6px; }
        .btn-import:hover { background: #5a6268; }
        .btn-print { background: #6f42c1; color: white; padding: 6px 12px; font-size: 13px; }
        .btn-print:hover { background: #5a32a3; }

        .filter-buttons { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-btn { background: var(--box-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .filter-btn.active { background: #007bff; color: white; border-color: #007bff; }

        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .kpi-card { background: var(--box-bg); padding: 15px; border-radius: 8px; text-align: center; border: 1px solid var(--border-color); }
        .kpi-card h4 { margin: 0; font-size: 14px; color: var(--text-color); opacity: 0.8; }
        .kpi-card span { font-size: 22px; font-weight: bold; color: #007bff; display: block; margin-top: 5px; }

        .search-box { margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 200px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; color: var(--text-color); }
        th, td { border: 1px solid var(--border-color); padding: 10px; text-align: center; font-size: 13px; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: var(--table-even); }
        
        .badge { padding: 4px 8px; border-radius: 4px; color: white; font-size: 11px; font-weight: bold; }
        .bg-success { background: #28a745; }
        .bg-warning { background: #ffc107; color: #333; }
        .bg-danger { background: #dc3545; }
        .bg-info { background: #17a2b8; }
        
        .view-section { display: none; }
        .view-section.active-view { display: block; }

        @media print {
            body { background: white; color: black; padding: 0; }
            .container { box-shadow: none; padding: 0; }
            .nav-tabs, .header-actions, .section-box:not(:nth-child(2)), .search-box, .filter-buttons, button, .btn { display: none !important; }
            table { width: 100%; font-size: 11px; }
            th { background-color: #ddd !important; color: black !important; -webkit-print-color-adjust: exact; }
        }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header-flex">
        <h2>🏥 نظام إدارة العيادات بماجستى وجداول الأطباء والمنسقين</h2>
        <div class="header-actions">
            <span class="sync-badge" id="syncStatus">🟢 متصل بالسحابة (مباشر)</span>
            <button class="btn btn-print" onclick="window.print()" title="طباعة تقرير اليوم">🖨️ طباعة التقرير</button>
            <button class="btn btn-export" onclick="exportData()" title="تحميل نسخة احتياطية">📥 تصدير السجلات</button>
            <label class="btn-import" title="استعادة سجلات من ملف احتياطي">
                📤 استيراد السجلات <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display: none;">
            </label>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تغيير الوضع المظلم/الفاتح">🌙</button>
        </div>
    </div>

    <!-- شريط التنقل بين الصفحات -->
    <div class="nav-tabs">
